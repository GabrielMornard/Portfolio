<div class="skills-section" id="skills">
  <div class="skills-header">
    <span class="section-eyebrow" translate>Skills.Eyebrow</span>
    <h2 translate>Skills.Title</h2>
  </div>

  @for (group of allGroups; track group.titleKey) {
    <div class="skill-category">
      <div class="category-label" translate>{{ group.titleKey }}</div>
      <div class="skill-row">
        @for (skill of group.skills; track skill.name) {
          <div class="skill-card">
            <img [src]="skill.image" [alt]="skill.alt" loading="lazy" />
            <span>{{ skill.name }}</span>
          </div>
        }
      </div>
    </div>
  }
</div>
