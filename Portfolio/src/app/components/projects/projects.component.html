<div class="projects-section" id="myProject">
  <div class="projects-header">
    <span class="section-eyebrow" translate>projet.Eyebrow</span>
    <h2 translate>projet.myProject</h2>
  </div>

  @for (project of projects; track project.titleKey; let i = $index) {
    <div class="project-card" [class.reverse]="project.imageLeft">
      <div class="project-info">
        <span class="project-number">{{ (i + 1).toString().padStart(2, '0') }}</span>
        <h3 translate>{{ project.titleKey }}</h3>
        <p translate>{{ project.descriptionKey }}</p>
        <div class="project-tags">
          @for (tag of project.tags; track tag) {
            <span class="tag">{{ tag }}</span>
          }
        </div>
        <a [href]="project.link" target="_blank" class="project-link" translate>
          projet.seeProject
        </a>
      </div>
      <div class="project-image">
        <img [src]="project.image" [alt]="project.alt" loading="lazy" />
      </div>
    </div>
  }
</div>
